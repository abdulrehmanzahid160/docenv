[project]
name = "docenv"
version = "0.1.0"
description = "Deterministic document-assistant sandbox for forecasting the first LLM-agent safety violation with and without plan access"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["docenv*"]
